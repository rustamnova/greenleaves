units_per_meter: auto
grid_step_m: 4.0
sample_step_m: 1.0
max_candidates: 50000
max_placements: 500
unknown_layers_excluded: false
boundary_layer_patterns: ["границ", "boundary", "контур", "участ"]
ignored_layer_patterns: ["подпис", "текст", "label", "annotation"]
categories:
  utility:
    patterns: ["канал", "водоп", "газ", "кабель", "элект", "тепл", "связ", "дрен", "ливн", "utility", "sewer", "water", "gas", "cable"]
    tree_buffer_m: 2.0
    shrub_buffer_m: null
    norm: "СП 42.13330.2016 — применимый пункт/таблица расстояний до инженерных сетей; точный пункт подлежит верификации"
  building:
    patterns: ["здан", "сооруж", "building", "wall", "стена"]
    tree_buffer_m: 5.0
    shrub_buffer_m: 1.5
    norm: "СП 42.13330.2016 — расстояния от наружных стен зданий и сооружений; точный пункт подлежит верификации"
  road:
    patterns: ["дорог", "проез", "тротуар", "дтс", "road", "curb", "асфальт", "бортов.*кам"]
    tree_buffer_m: 2.0
    shrub_buffer_m: 1.0
    norm: "СП 42.13330.2016 и требования проекта по уличному фронту; Q&A заказчика рекомендует не менее 1 м от зоны работы техники"
  existing_tree:
    patterns: ["дерев", "дендро", "tree", "существ.*озелен"]
    tree_buffer_m: 5.0
    shrub_buffer_m: 2.0
    norm: "Требования сохранения существующих зелёных насаждений и проектный дендроплан"
  water:
    patterns: ["водоем", "пруд", "река", "water", "берег"]
    tree_buffer_m: 1.0
    shrub_buffer_m: 0.5
    norm: "Проектные ограничения водного объекта и условия произрастания"
  obstacle:
    patterns: ["знак", "указател", "щит", "огражд", "малые архитектур", "маф", "светофор", "опор"]
    tree_buffer_m: 2.0
    shrub_buffer_m: 1.0
    norm: "Проектный безопасный отступ от наземных объектов; значение уточняется по ведомости объекта"
species:
  street_tree:
    name: "Липа мелколистная"
    reasons: ["районирована для Москвы", "формирует тень", "подходит для многоярусного уличного озеленения"]
  yard_tree:
    name: "Клён остролистный"
    reasons: ["районирован для Москвы", "подходит для дворовых и общественных пространств", "формирует развитую крону"]
  wet_tree:
    name: "Ива белая"
    reasons: ["предпочитает увлажнённые условия", "подходит для зон рядом с водой"]
  street_shrub:
    name: "Кизильник блестящий"
    reasons: ["устойчив к городской нагрузке", "пригоден для защитных полос и живых изгородей"]
  yard_shrub:
    name: "Спирея японская"
    reasons: ["подходит для дворовых территорий", "формирует устойчивую декоративную группу"]
